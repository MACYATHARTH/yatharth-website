<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="g-grad-photo-8.svg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#241E1A"/>
      <stop offset="60%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#0B0A09"/>
    </radialGradient>
    <pattern id="g-grid-photo-8.svg" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(233,230,223,0.04)" stroke-width="1"/>
    </pattern>
    <linearGradient id="g-border-photo-8.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B44033" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="rgba(233,230,223,0.15)"/>
      <stop offset="100%" stop-color="#B44033" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="600" fill="url(#g-grad-photo-8.svg)"/>
  <rect width="800" height="600" fill="url(#g-grid-photo-8.svg)"/>

  <!-- Editorial Film Frame & Crop Marks -->
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="url(#g-border-photo-8.svg)" stroke-width="1.5"/>
  <rect x="35" y="35" width="730" height="530" fill="none" stroke="rgba(233,230,223,0.06)" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Outer Filmstrip Perforations -->
  <g fill="rgba(233,230,223,0.08)">
    <rect x="60" y="42" width="16" height="10" rx="2"/>
    <rect x="120" y="42" width="16" height="10" rx="2"/>
    <rect x="180" y="42" width="16" height="10" rx="2"/>
    <rect x="240" y="42" width="16" height="10" rx="2"/>
    <rect x="540" y="42" width="16" height="10" rx="2"/>
    <rect x="600" y="42" width="16" height="10" rx="2"/>
    <rect x="660" y="42" width="16" height="10" rx="2"/>
    <rect x="720" y="42" width="16" height="10" rx="2"/>

    <rect x="60" y="548" width="16" height="10" rx="2"/>
    <rect x="120" y="548" width="16" height="10" rx="2"/>
    <rect x="180" y="548" width="16" height="10" rx="2"/>
    <rect x="240" y="548" width="16" height="10" rx="2"/>
    <rect x="540" y="548" width="16" height="10" rx="2"/>
    <rect x="600" y="548" width="16" height="10" rx="2"/>
    <rect x="660" y="548" width="16" height="10" rx="2"/>
    <rect x="720" y="548" width="16" height="10" rx="2"/>
  </g>

  <!-- Central Visual Symbolism -->
  <g transform="translate(400, 250)">
    <circle r="120" fill="none" stroke="rgba(143,48,37,0.18)" stroke-width="2"/>
    <circle r="95" fill="rgba(23,21,19,0.7)" stroke="rgba(233,230,223,0.12)" stroke-width="1.5"/>
    <circle r="75" fill="none" stroke="rgba(143,48,37,0.35)" stroke-width="1" stroke-dasharray="8 6"/>

    <line x1="-135" y1="0" x2="-100" y2="0" stroke="#B44033" stroke-width="1.5"/>
    <line x1="100" y1="0" x2="135" y2="0" stroke="#B44033" stroke-width="1.5"/>
    <line x1="0" y1="-135" x2="0" y2="-100" stroke="#B44033" stroke-width="1.5"/>
    <line x1="0" y1="100" x2="0" y2="135" stroke="#B44033" stroke-width="1.5"/>

    <g transform="translate(-24, -24) scale(2)">
      <path d="M12 15l-2 5l9-13h-7l2-5l-9 13h7z" fill="none" stroke="#B44033" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Top Metadata Bar -->
  <text x="60" y="90" fill="#B44033" font-family="monospace, ui-monospace" font-size="12" font-weight="700" letter-spacing="3">HONOURS // CITATIONS</text>
  <text x="740" y="90" text-anchor="end" fill="rgba(233,230,223,0.4)" font-family="monospace, ui-monospace" font-size="11" letter-spacing="2">ARCHIVE // MAC-DU</text>

  <!-- Lower Title and Details -->
  <text x="60" y="440" fill="#E9E6DF" font-family="'Georgia', serif" font-size="34" font-weight="700" letter-spacing="1">Investigative Citations Handover</text>
  <text x="60" y="475" fill="#B44033" font-family="monospace, ui-monospace" font-size="14" font-weight="600" letter-spacing="2">Department of Journalism</text>
  <text x="60" y="515" fill="#A8A29E" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400">Student correspondents receiving certificates of excellence and press badges.</text>
</svg>