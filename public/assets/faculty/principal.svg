<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <radialGradient id="f-grad-principal.svg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#241E1A"/>
      <stop offset="60%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#0B0A09"/>
    </radialGradient>
    <pattern id="f-grid-principal.svg" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(233,230,223,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="500" height="600" fill="url(#f-grad-principal.svg)"/>
  <rect width="500" height="600" fill="url(#f-grid-principal.svg)"/>

  <!-- Border Frames -->
  <rect x="20" y="20" width="460" height="560" fill="none" stroke="rgba(233,230,223,0.08)" stroke-width="1"/>
  <rect x="28" y="28" width="444" height="544" fill="none" stroke="#8F3025" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Institutional Monogram Frame -->
  <g transform="translate(250, 200)">
    <circle r="105" fill="rgba(23,21,19,0.85)" stroke="#8F3025" stroke-width="2"/>
    <circle r="95" fill="none" stroke="rgba(233,230,223,0.12)" stroke-width="1" stroke-dasharray="6 4"/>
    <circle r="80" fill="none" stroke="#8F3025" stroke-opacity="0.4" stroke-width="1"/>

    <text x="0" y="24" text-anchor="middle" fill="#E9E6DF" font-family="'Georgia', serif" font-size="64" font-weight="700" letter-spacing="3">P</text>
  </g>

  <!-- Category Badge -->
  <g transform="translate(250, 360)">
    <rect x="-110" y="-14" width="220" height="28" rx="2" fill="rgba(143,48,37,0.15)" stroke="#8F3025" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#8F3025" font-family="monospace, ui-monospace" font-size="11" font-weight="700" letter-spacing="2">INSTITUTIONAL FACULTY</text>
  </g>

  <!-- Name and Details -->
  <text x="250" y="430" text-anchor="middle" fill="#E9E6DF" font-family="'Georgia', serif" font-size="24" font-weight="700">Principal Name</text>
  <text x="250" y="460" text-anchor="middle" fill="#8F3025" font-family="monospace, ui-monospace" font-size="13" font-weight="600" letter-spacing="1">Principal & Patron</text>
  <text x="250" y="485" text-anchor="middle" fill="rgba(233,230,223,0.6)" font-family="system-ui, -apple-system, sans-serif" font-size="12">Maharaja Agrasen College</text>

  <!-- Lower Institutional Seal Line -->
  <line x1="100" y1="520" x2="400" y2="520" stroke="rgba(233,230,223,0.1)" stroke-width="1"/>
  <text x="250" y="545" text-anchor="middle" fill="rgba(233,230,223,0.35)" font-family="monospace, ui-monospace" font-size="10" letter-spacing="1.5">MAHARAJA AGRASEN COLLEGE &bull; DU</text>
</svg>